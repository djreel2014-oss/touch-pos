<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b1f2a;--mute:#697086;--line:#dfe2ea;--acc:#2a5bd7;--accink:#fff;--ok:#1d8a4e;--warn:#c47a00;--bad:#c9302c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e222b;--ink:#eceff6;--mute:#9aa2b8;--line:#2f3543;--acc:#6b93ff;--accink:#0d1220;--ok:#43c47c;--warn:#f0a832;--bad:#ff6b66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e222b;--ink:#eceff6;--mute:#9aa2b8;--line:#2f3543;--acc:#6b93ff;--accink:#0d1220;--ok:#43c47c;--warn:#f0a832;--bad:#ff6b66;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0 12px 0 0}
.tab,.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
.tab.on,.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-width:0;display:flex;min-height:0}
.pane{overflow:auto;padding:14px;flex:1;min-width:0}
.side{width:370px;max-width:44%;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:130px;color:var(--ink);font:inherit}
.pcard:active{transform:scale(.97)}.pcard.out .pimg,.pcard.out .pbody{opacity:.45}
.ptab{width:100%;padding:7px 10px;font-size:13px;font-weight:700;text-align:center;border-top:1px solid var(--line)}
.t-zero{background:rgba(201,48,44,.16);color:var(--bad)}.t-low{background:rgba(196,122,0,.16);color:var(--warn)}.t-soon{background:rgba(196,122,0,.10);color:var(--warn)}.t-cart{background:rgba(42,91,215,.14);color:var(--acc)}.t-ok{background:rgba(29,138,78,.12);color:var(--ok)}
.pcard{padding:0;overflow:hidden;min-height:0;gap:0}
.pimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--line);pointer-events:none}
.pimg.nop{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--mute)}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;width:100%}
.pcard.drag{opacity:.35}.pcard.over{outline:3px dashed var(--acc)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;touch-action:pan-x}
.cat{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.cat.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}.cat.over{outline:3px dashed var(--acc)}
.ch{margin:14px 0 8px;font-size:15px;color:var(--mute);font-weight:700}
.side.over{outline:3px dashed var(--acc);outline-offset:-6px}
.ckb{width:26px;height:26px;min-height:0;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}.cell b{font-size:16px;color:var(--ink)}.cell small{font-size:10px;line-height:1.1;text-align:center}.cell.open{background:rgba(67,196,124,.18);color:var(--ok);border-color:var(--ok)}.cell.today b{text-decoration:underline}
.pn{font-weight:700;font-size:17px}.pp{font-size:20px;font-weight:700;color:var(--acc)}
.stock{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.low .dot{background:var(--warn)}.zero .dot{background:var(--bad)}
.cust{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.ph{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:26px}
.big .ph{width:110px;height:110px}
.lines{flex:1;overflow:auto;min-height:60px}
#recent{margin-bottom:12px}#recent h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.rc{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 14px 4px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;max-width:190px}
.chip .ph{width:44px;height:44px;border-radius:10px;font-size:18px}.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.bigph{width:100%;height:min(34vh,300px);object-fit:cover;border-radius:14px;display:block;background:var(--line)}
.bigph.nop{display:flex;align-items:center;justify-content:center;font-size:72px;color:var(--mute)}
.tags{display:flex;flex-direction:column;gap:6px}.tags.sm{flex-direction:row;flex-wrap:wrap;margin:4px 0}
.tag{padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px;border:2px solid currentColor}
.tag small{display:block;font-weight:600;font-size:13px}
.tag.w{color:var(--warn);background:rgba(240,168,50,.14)}.tag.g{color:var(--ok);background:rgba(67,196,124,.14)}.tag.b{color:var(--acc);background:rgba(107,147,255,.14)}
.tags.sm .tag{padding:3px 10px;font-size:13px}
.ck{display:flex;align-items:center;gap:12px;min-height:52px;font-size:16px;color:var(--ink);margin:6px 0;cursor:pointer}.ck input{width:28px;height:28px;min-height:0;flex:none;padding:0}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1}.q{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:700;touch-action:none;user-select:none}
.tot{font-size:26px;font-weight:800;display:flex;justify-content:space-between}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px;width:100%}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 3px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--mute);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--line)}

  else if(t==='month'){d=new Date((v||iso().slice(0,7))+'-01T00:00');s=d.getTime();var n=new Date(d);n.setMonth(n.getMonth()+1);e=n.getTime();lab=d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}

/* multi-unit packs drawing from an overall stock pool */
function pool(p){return(p.src&&prod(p.src))||p}
function upu(p){return Math.max(1,+p.units||1)}
function avail(p){return Math.floor(pool(p).stock/upu(p))}
function cartUnits(po){var t=0;for(var id in cart){var x=prod(id);if(x&&pool(x)===po)t+=cart[id]*upu(x)}return t}
function availNow(p){return Math.max(0,Math.floor((pool(p).stock-cartUnits(pool(p)))/upu(p)))}
function tabV1(p){var a=avail(p),an=availNow(p),t,c,f=FC[p.id];
  if(a<=0){c='zero';t='Out of stock'}
  else if(an<=0){c='cart';t='All '+a+' in cart'}
  else if(a<=p.reorder){c='low';t='Low stock \u00b7 '+an+' left'}
  else if(f&&f.out&&f.left<=7){c='soon';t=f.left<1?'Running out today':'Selling fast \u00b7 out '+f.out.toLocaleDateString(undefined,{weekday:'short'})}
  else{c='ok';t='In stock'}
  return'<div class="ptab t-'+c+'">'+esc(t)+'</div>'}
